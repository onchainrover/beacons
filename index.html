<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>OnChainRover</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{

font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
background:#0b0d11;
color:#e6e6e6;
line-height:1.6;

}

.hero img{

width:100%;
max-height:420px;
object-fit:cover;

}

.container{

max-width:900px;
margin:auto;
padding:50px 20px;

}

h1{

font-size:42px;
margin-bottom:10px;

}

.subtitle{

color:#9aa4af;
margin-bottom:40px;
font-size:18px;

}

.links{

display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:60px;

}

.link-card{

padding:26px;
border-radius:14px;
text-decoration:none;
color:white;
background:#151922;
border:1px solid #242a35;
transition:0.2s;

}

.link-card:hover{

transform:translateY(-4px);
border-color:#3b82f6;

}

.link-title{

font-size:22px;
margin-bottom:6px;

}

.link-desc{

color:#9aa4af;
font-size:15px;

}

.section-title{

font-size:24px;
margin-bottom:20px;

}

.tools{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;

}

.tool{

background:#151922;
border:1px solid #242a35;
padding:18px;
border-radius:10px;

}

.tool-title{

font-size:16px;
margin-bottom:6px;

}

.tool-desc{

font-size:14px;
color:#9aa4af;

}

footer{

margin-top:70px;
padding-top:30px;
border-top:1px solid #242a35;
color:#7b8591;
font-size:14px;

}

</style>

</head>

<body>

<div class="hero">

<img src="portada.png">

</div>

<div class="container">

<h1>OnChainRover</h1>

<div class="subtitle">
On-chain analysis, crypto research and market intelligence.
</div>

<div class="links">

<a class="link-card" href="https://x.com/OnChainRover" target="_blank">

<div class="link-title">
Follow on X
</div>

<div class="link-desc">
Short insights, charts and real time market observations.
</div>

</a>

<a class="link-card" href="https://onchainrover.substack.com/" target="_blank">

<div class="link-title">
Read the Newsletter
</div>

<div class="link-desc">
Long-form research, on-chain reports and deep analysis.
</div>

</a>

</div>
