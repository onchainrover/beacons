<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OnChainRover</title>

<style>

body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background:#0f1115;
    color:white;
    text-align:center;
}

.header{
    width:100%;
}

.header img{
    width:100%;
    max-height:420px;
    object-fit:cover;
}

.container{
    max-width:600px;
    margin:auto;
    padding:40px 20px;
}

h1{
    font-size:40px;
    margin-bottom:10px;
}

.tagline{
    color:#aaa;
    margin-bottom:40px;
}

.links{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.button{
    display:block;
    padding:18px;
    font-size:20px;
    text-decoration:none;
    border-radius:12px;
    transition:0.2s;
}

.x{
    background:#1DA1F2;
    color:white;
}

.substack{
    background:#ff6719;
    color:white;
}

.button:hover{
    transform:scale(1.04);
}

.footer{
    margin-top:50px;
    color:#777;
    font-size:14px;
}

</style>
</head>

<body>

<div class="header">
<img src="portada.png" alt="OnChainRover">
</div>

<div class="container">

<h1>OnChainRover</h1>

<div class="tagline">
On-chain crypto analysis
</div>

<div class="links">

<a class="button x" href="https://x.com/OnChainRover" target="_blank">
Follow on X
</a>

<a class="button substack" href="https://onchainrover.substack.com/" target="_blank">
Read the Substack
</a>

</div>

<div class="footer">
© OnChainRover
</div>

</div>

</body>
</html>
